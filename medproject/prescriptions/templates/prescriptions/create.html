<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Создать рецепт</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="card-title mb-4 text-center">🧑‍⚕️ Создать рецепт</h2>

                    <form method="post" novalidate>
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-success w-100 mt-3">Создать</button>
                    </form>

                    <div class="d-flex justify-content-between mt-4">
                        <a href="{% url 'prescriptions_list' %}" class="btn btn-primary">Список рецептов</a>
                        <button class="btn btn-secondary" onclick="window.history.back()">Назад</button>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
