<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Prescription Detail</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
<div class="container my-5">
    <h1 class="mb-4">Prescription #{{ prescription.pk }}</h1>

    <div class="card">
        <div class="card-body">
            <h5 class="card-title">Patient: <span class="text-primary">{{ prescription.patient_name }}</span></h5>
            <p class="card-text"><strong>Medication:</strong> {{ prescription.medication }}</p>
            <p class="card-text"><strong>Dosage:</strong> {{ prescription.dosage }}</p>
            <p class="card-text"><strong>Instructions:</strong> {{ prescription.instructions }}</p>
            <a href="{% url 'download_prescription_pdf' prescription.pk %}" class="btn btn-success mt-3">Download PDF</a>
        </div>
    </div>
</div>

<!-- Bootstrap JS Bundle CDN (optional) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
